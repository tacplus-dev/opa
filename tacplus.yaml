language: go
tacplus: "2.6"
# pkg is derived from go.mod (github.com/tacplus-dev/opa: the org name has a hyphen,
# which pkg cannot carry). A derived Go package is <module>/tacplus, so the output is "tacplus".
output-dir: tacplus
output-name: tacplus
src: proto
header: |
  Copyright (c) 2026 Jody Scott
  SPDX-License-Identifier: Apache-2.0
# opa serves the eval RPCs for kernel's opa_eval messages (vservices userentitlements
# and proxypolicy, in kernel's contract), so kernel's proto must be in the run.
depends:
  - kernel
grpc-servers: all
