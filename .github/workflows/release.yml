name: release

# On a version tag vX.Y.Z: run the gates on the tag, publish ghcr.io/tacplus-dev/opa:X.Y.Z for PLATFORMS, move the
# line tag X.Y when this is the line's highest release (ci/release-tags.sh), and create the GitHub release with
# the commits since the previous release (ci/release-notes.sh), marked Latest only when it is the highest release
# of all (ci/release-latest.sh). A pre-release (vX.Y.Z-rc.N) publishes only its own tag. Fleets pin X.Y
# (tacplus-dev/tacplus#180). Modelled on tacplus-dev/llmproxy's and kernel's; how to cut a release: README.md.
#
# workflow_dispatch builds a version by hand. With publish, the version must be an existing tag, made before this
# workflow existed (v0.1.0 to v0.2.1) or whose run failed: its own source is checked out and gated, built and
# published exactly as a push of it would be, by this commit's ci/ (ci/checkout.sh); the tag never moves. Without
# publish it is a dry run: an existing tag is built from its source, any other version from this commit, tagged
# locally, and the image tags and notes that release would get are printed; nothing is published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v0.1.0"
        required: true
      publish:
        description: "Publish the existing tag (else a dry run, which publishes nothing)"
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, so of two tags on one line the later run sees the other before it moves X.Y.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
  # The architectures the image is built for: arm64, what the fleets run on. amd64 is off by default, as in the
  # fleets (fleet-seatrials images/pins.yaml `platforms`), to save a second, emulated build; "arm64 amd64"
  # builds both into one multi-architecture image.
  PLATFORMS: arm64
  # The launcher every service image runs under (Dockerfile), built from source at this commit.
  LAUNCHER_COMMIT: c54ae30e7aa928d166beb423ddcb896a270d80be

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag: the line tag and the notes depend on the releases already made.
          fetch-depth: 0
      - name: Source, tags and notes
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          existing="$(ci/checkout.sh "$VERSION")"
          tools="$RUNNER_TEMP/ci"
          if [[ $existing == existing=false ]]; then
            if [[ $DRY_RUN != true ]]; then
              echo "$VERSION is not a tag: push the tag to release it"; exit 1
            fi
            git tag "$VERSION"
          elif [[ $DRY_RUN != true ]] && gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already released"; exit 1
          fi
          revision="$(git rev-parse HEAD)"
          tags="$("$tools/release-tags.sh" "$VERSION")"
          flag="$("$tools/release-latest.sh" "$VERSION")"
          "$tools/release-notes.sh" "$VERSION" > "$RUNNER_TEMP/notes.md"
          { echo "tools=$tools"; echo "revision=$revision"; echo "tags=$tags"; echo "flag=$flag"; } >> "$GITHUB_OUTPUT"
          echo "dry run: $DRY_RUN"
          echo "source: $VERSION at $revision"
          echo "image tags: $(for t in $tags; do printf '%s:%s ' "$IMAGE" "$t"; done)"
          echo "platforms: $PLATFORMS"
          echo "release: $flag"
          cat "$RUNNER_TEMP/notes.md"
      - name: opa, each architecture
        env:
          # Read-only (this job's token has no write to anything tacplus reads): tacplus fetches `depends`
          # from github.com with it.
          GH_TOKEN: ${{ github.token }}
        run: ${{ steps.plan.outputs.tools }}/build-image.sh ${{ steps.plan.outputs.tools }}/release-build.sh $PLATFORMS
      - uses: actions/checkout@v4
        with:
          repository: tacplus-dev/launcher
          ref: ${{ env.LAUNCHER_COMMIT }}
          path: bin/launcher-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: bin/launcher-src/go.mod
          cache: false
      - name: launcher, each architecture
        working-directory: bin/launcher-src
        run: |
          for arch in $PLATFORMS; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "../launcher/launcher-linux-$arch" .
          done
      # The Dockerfile's apk add runs on each target architecture.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.DRY_RUN != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        env:
          ARCHS: ${{ env.PLATFORMS }}
        run: |
          tags=""
          [[ $DRY_RUN == true ]] || tags="${{ steps.plan.outputs.tags }}"
          # shellcheck disable=SC2086 # the tags are words
          "${{ steps.plan.outputs.tools }}/release-image.sh" "${VERSION#v}" "${{ steps.plan.outputs.revision }}" $tags
          [[ $DRY_RUN == true ]] || docker buildx imagetools inspect "$IMAGE:${VERSION#v}"
      - name: GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" ${{ steps.plan.outputs.flag }}
